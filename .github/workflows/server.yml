name: Server

# Build rapide du serveur Go + du client Web, sans reconstruire les
# installateurs.
#
# Complement de release.yml, pas son remplacant : celui-ci sert a iterer sur le
# serveur (~6 min sur un seul runner ubuntu) quand release.yml en demande ~26
# repartis sur trois OS. Il ne cree ni tag git ni GitHub Release.
#
# L'image n'embarque pas les installateurs (ADR-0062) : le serveur les prend
# dans la Release de sa version. Cette image porte un tag `main-<sha>`, qui n'a
# pas de Release : elle propose celle de la plus recente.
#
# Publie par defaut sur :latest, le tag que suit docker-compose.yml (sans
# ONYX_VERSION dans .env) : le serveur de test recupere le build par un simple
# `docker compose pull`.
#
# Deux images sortent : l'Alpine sous le tag demande, et la variante NVIDIA
# sous <tag>-nvidia. Avec `variant: nvidia`, seule l'image NVIDIA est
# construite et c'est elle que porte le tag demande : pour le tag d'une branche
# personnelle dont le serveur de test a une carte. Voir l'ADR
# 2026-11-27-fytroz-image-nvidia.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag Docker a publier"
        required: true
        default: "latest"
        type: string
      variant:
        description: "Image publiee sous ce tag : alpine (et <tag>-nvidia a cote), ou nvidia (le tag lui-meme porte l'image NVIDIA)"
        required: true
        default: "alpine"
        type: choice
        options:
          - alpine
          - nvidia

permissions:
  contents: read
  packages: write

env:
  FLUTTER_VERSION: "3.50.1"
  IMAGE_NAME: onyx-server

# Deux lancements rapproches n'ont pas a produire deux images concurrentes :
# seul le dernier compte.
concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pas d'image tant que les tests du serveur ne passent pas. Ceux de l'app ne
  # bloquent pas un build serveur : release.yml, qui publie les applications,
  # les exige toujours.
  test:
    uses: ./.github/workflows/ci.yml
    with:
      app_tests: false

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - id: meta
        env:
          TAG_INPUT: ${{ inputs.tag }}
          VARIANT_INPUT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          OWNER_LC="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/$OWNER_LC/$IMAGE_NAME"

          TAG="${TAG_INPUT:-latest}"
          VARIANT="${VARIANT_INPUT:-alpine}"

          # `latest` est le tag du compose de tout le monde, publie pour amd64
          # et arm64 : l'image NVIDIA, amd64 seulement, n'a pas a le prendre.
          if [ "$VARIANT" = "nvidia" ] && [ "$TAG" = "latest" ]; then
            echo "::error::variant=nvidia ne publie pas sur latest : utilisez latest-nvidia (variant=alpine) ou un autre tag."
            exit 1
          fi

          NVIDIA_TAG="$TAG-nvidia"
          if [ "$VARIANT" = "nvidia" ]; then
            NVIDIA_TAG="$TAG"
          fi

          {
            echo "image=$IMAGE"
            echo "tag=$TAG"
            echo "variant=$VARIANT"
            echo "nvidia_tag=$NVIDIA_TAG"
            echo "sha_tag=main-$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Embarque dans le binaire Go via go:embed : doit exister avant le build.
      - name: Build du client Web
        run: bash scripts/build-web.sh

      # L'image arm64 (NAS ARM, Raspberry Pi) installe FFmpeg sous emulation ;
      # le binaire Go, lui, est compile en croise sans elle.
      - name: QEMU (arm64)
        if: steps.meta.outputs.variant != 'nvidia'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Build & push de l'image
        if: steps.meta.outputs.variant != 'nvidia'
        uses: docker/build-push-action@v7
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.sha_tag }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # La variante NVIDIA (Ubuntu + FFmpeg avec NVENC), suffixe -nvidia :
      # un serveur a carte NVIDIA suit `latest-nvidia`. amd64 seulement, comme
      # le FFmpeg qu'elle embarque. Avec `variant: nvidia`, elle prend le tag
      # demande, sans suffixe. Voir l'ADR 2026-11-27-fytroz-image-nvidia.
      - name: Build & push de l'image NVIDIA
        uses: docker/build-push-action@v7
        with:
          context: ./server
          target: nvidia
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.meta.outputs.sha_tag }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.nvidia_tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}-nvidia
          cache-from: type=gha,scope=nvidia
          cache-to: type=gha,mode=max,scope=nvidia

      - name: Recapitulatif
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          VARIANT: ${{ steps.meta.outputs.variant }}
          NVIDIA_TAG: ${{ steps.meta.outputs.nvidia_tag }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          {
            echo "### Image serveur publiee"
            echo ""
            echo '```'
            echo "docker pull $IMAGE:$TAG"
            echo '```'
            echo ""
            if [ "$VARIANT" = "nvidia" ]; then
              echo "Image NVIDIA (amd64), egalement taguee \`$SHA_TAG-nvidia\`. Pas d'image Alpine dans ce lancement."
            else
              echo "Egalement taguee \`$SHA_TAG\`. Variante NVIDIA : \`$NVIDIA_TAG\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
