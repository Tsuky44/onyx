# Onyx, le serveur.
#
#   1. cp .env.example .env
#   2. Remplissez .env (au minimum MEDIA_PATH).
#   3. docker compose up -d
#
# Puis ouvrez http://<votre-serveur>:8080 : le premier compte créé devient le
# propriétaire. Les bibliothèques se créent dans l'app (Paramètres →
# Bibliothèque), qui propose les dossiers trouvés dans MEDIA_PATH.
#
# Tous les réglages sont dans .env : ce fichier n'a pas à être modifié, sauf
# pour le transcodage matériel (plus bas) ou un second disque de médias.

services:
  onyx:
    image: ghcr.io/tsuky44/onyx-server:${ONYX_VERSION:-latest}
    # Pour construire l'image depuis les sources de ce dépôt (sans l'app web
    # embarquée, que publish-image.sh y ajoute) :
    # build: ./server
    container_name: onyx-server
    # L'image des versions est publiée pour amd64 seulement (ADR-0051).
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${ONYX_PORT:-8080}:8080"
    volumes:
      # La base, les sous-titres extraits et les aperçus de lecture.
      - ${ONYX_DATA:-./data}:/app/data
      # Vos médias, vus par le serveur sous /media.
      - ${MEDIA_PATH:?Indiquez le dossier de vos médias (MEDIA_PATH) dans .env}:/media:${MEDIA_ACCESS:-ro}
      # Un autre disque ? Montez-le sous /media, il sera proposé aussi :
      # - /mnt/disque2/Films:/media/Films-disque2:ro
    # Tout ce que .env contient est passé au serveur : les réglages
    # facultatifs s'activent en y décommentant leur ligne.
    env_file: .env
    # Transcodage par le circuit vidéo (Intel, AMD) : décommentez ces deux
    # lignes et mettez VIDEO_ENCODER=auto dans .env.
    # devices:
    #   - /dev/dri:/dev/dri
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
