# Onyx, le serveur : `docker compose up -d`, puis http://<serveur>:8080.
# Créez votre compte : l'assistant guide le reste (bibliothèques, TMDB, demandes).
services:
  onyx:
    image: ghcr.io/tsuky44/onyx-server:latest
    container_name: onyx-server
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data   # la base et le cache
      - ./media:/media:ro  # vos médias : remplacez ./media par votre dossier
