name: media_kit_video
description: Native implementation for video playback in package:media_kit.
homepage: https://github.com/media-kit/media-kit
repository: https://github.com/media-kit/media-kit
version: 2.0.1
topics:
  - video
  - video-player
  - audio
  - audio-player
  - cross-platform

environment:
  sdk: ">=2.17.0 <4.0.0"
  # Onyx : 3.47, le plancher de material_ui (ADR-0168).
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # Onyx : Material hors du SDK depuis Flutter 3.47 (ADR-0168). Le SubtitleView
  # pose un Material qui doit lire le thème de l'app, celui de material_ui.
  material_ui: ^1.11.1

  media_kit: ^1.2.3

  synchronized: ^3.1.0
  wakelock_plus: ^1.1.6
  universal_platform: ^1.0.0+1
  plugin_platform_interface: ^2.0.2
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ^5.0.0



flutter:
  plugin:
    platforms:
      windows:
        pluginClass: MediaKitVideoPluginCApi
      linux:
        pluginClass: MediaKitVideoPlugin
      macos:
        pluginClass: MediaKitVideoPlugin
      ios:
        pluginClass: MediaKitVideoPlugin
      android:
        package: com.alexmercerind.media_kit_video
        pluginClass: MediaKitVideoPlugin
      web:
